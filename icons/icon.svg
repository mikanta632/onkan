<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD6E0"/>
      <stop offset="1" stop-color="#FF8FAB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#C2366B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 背景（iOS が角を丸めるので四角いまま塗る） -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- きらきら -->
  <g fill="#FFFFFF">
    <path d="M118 112 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z" opacity="0.9"/>
    <path d="M412 368 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" opacity="0.85"/>
    <circle cx="420" cy="118" r="9" opacity="0.7"/>
    <circle cx="96" cy="300" r="7" opacity="0.6"/>
    <circle cx="372" cy="440" r="6" opacity="0.6"/>
  </g>

  <!-- 八分音符 -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- 旗 -->
    <path d="M300 96 C318 150 404 160 414 244 C419 284 402 312 384 330 C394 294 392 258 366 236 C346 219 322 214 300 210 Z"/>
    <!-- 棒 -->
    <rect x="286" y="86" width="34" height="270" rx="17"/>
    <!-- 玉 -->
    <ellipse cx="214" cy="352" rx="112" ry="90" transform="rotate(-18 214 352)"/>
  </g>

  <!-- 顔 -->
  <g>
    <ellipse cx="248" cy="380" rx="18" ry="11" fill="#FF9FB8" opacity="0.85"/>
    <ellipse cx="140" cy="404" rx="18" ry="11" fill="#FF9FB8" opacity="0.85"/>
    <ellipse cx="166" cy="365" rx="12" ry="15" fill="#5A3446"/>
    <ellipse cx="228" cy="344" rx="12" ry="15" fill="#5A3446"/>
    <circle cx="162" cy="359" r="4.5" fill="#FFFFFF"/>
    <circle cx="224" cy="338" r="4.5" fill="#FFFFFF"/>
    <path d="M184 384 Q200 400 214 378" fill="none" stroke="#5A3446" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
